name = "india-holidays-api"
main = "src/worker.js"
compatibility_date = "2024-01-01"
pages_build_output_dir = "./data"

# Assets configuration for Cloudflare Workers Static Assets
[assets]
directory = "./data"
binding = "ASSETS"

# Environment variables
[vars]
TIMEZONE = "Asia/Kolkata"
API_VERSION = "1.0.0"
