name: Validate JSON & Worker Tests

on:
  push:
    paths:
      - 'data/**/*.json'
      - 'src/**'
      - 'test/**'
  pull_request:
    paths:
      - 'data/**/*.json'
      - 'src/**'
      - 'test/**'

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Validate JSON files
        run: |
          echo "Validating JSON files in data directory..."
          find data -name "*.json" -type f | while read file; do
            echo "Checking $file..."
            if ! python3 -m json.tool "$file" > /dev/null 2>&1; then
              echo "ERROR: Invalid JSON in $file"
              exit 1
            fi
          done
          echo "All JSON files are valid!"

      - name: Validate holiday schema
        run: |
          echo "Validating holiday data schema..."
          python3 << 'EOF'
          import json
          import os
          import sys
          from datetime import datetime
          
          required_base_fields = ['date', 'name', 'type', 'description']
          valid_types = ['national', 'public', 'state', 'bank', 'regional', 'optional', 'restricted', 'observance']
          
          errors = []
          
          for root, dirs, files in os.walk('data'):
              for file in files:
                  if file.endswith('.json'):
                      filepath = os.path.join(root, file)
                      try:
                          with open(filepath, 'r', encoding='utf-8') as f:
                              data = json.load(f)
                          
                          # Check if it's a list (holidays) or dict (meta)
                          if isinstance(data, list):
                              for i, holiday in enumerate(data):
                                  for field in required_base_fields:
                                      if field not in holiday:
                                          errors.append(f"{filepath}[{i}]: Missing required field '{field}'")
                                  
                                  # Must have either state_code, region_code, or country_code
                                  if 'state_code' not in holiday and 'region_code' not in holiday and 'country_code' not in holiday:
                                      errors.append(f"{filepath}[{i}]: Missing region identifier (state_code/region_code/country_code)")

                                  # Validate date format
                                  if 'date' in holiday:
                                      try:
                                          datetime.strptime(holiday['date'], '%Y-%m-%d')
                                      except ValueError:
                                          errors.append(f"{filepath}[{i}]: Invalid date format '{holiday['date']}'. Expected YYYY-MM-DD")
                                  
                                  # Validate type
                                  if 'type' in holiday and holiday['type'] not in valid_types:
                                      errors.append(f"{filepath}[{i}]: Invalid type '{holiday['type']}'. Must be one of {valid_types}")
                                  
                                  # Validate state_code or region_code format
                                  region_id = holiday.get('state_code') or holiday.get('region_code')
                                  if region_id:
                                      if not (isinstance(region_id, str) and 2 <= len(region_id) <= 5):
                                          errors.append(f"{filepath}[{i}]: Invalid region_id '{region_id}'")

                                  # Validate country_code format
                                  if 'country_code' in holiday:
                                      if not (isinstance(holiday['country_code'], str) and len(holiday['country_code']) == 2 and holiday['country_code'].isupper()):
                                          errors.append(f"{filepath}[{i}]: Invalid country_code '{holiday['country_code']}'")
                          
                          elif isinstance(data, dict):
                              # Meta files - basic validation
                              if 'states' in data:
                                  for state in data['states']:
                                      if 'code' not in state or 'name' not in state:
                                          errors.append(f"{filepath}: State missing 'code' or 'name'")
                              elif 'countries' in data:
                                  for c in data['countries']:
                                      if 'code' not in c or 'name' not in c:
                                          errors.append(f"{filepath}: Country missing 'code' or 'name'")
                              elif 'regions' in data:
                                  for r in data['regions']:
                                      if 'code' not in r or 'name' not in r:
                                          errors.append(f"{filepath}: Region missing 'code' or 'name'")
                              elif 'types' in data:
                                  for htype in data['types']:
                                      if 'id' not in htype or 'name' not in htype:
                                          errors.append(f"{filepath}: Type missing 'id' or 'name'")
                      
                      except json.JSONDecodeError as e:
                          errors.append(f"{filepath}: JSON parse error - {str(e)}")
                      except Exception as e:
                          errors.append(f"{filepath}: Unexpected error - {str(e)}")
          
          if errors:
              print("Validation errors found:")
              for error in errors:
                  print(f"  - {error}")
              sys.exit(1)
          else:
              print("All holiday data is valid!")
          EOF

      - name: Run API Worker Tests
        run: node test/worker.test.js
