name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'src/**'
      - 'test/**'
      - 'wrangler.toml'
      - 'package.json'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Validate JSON before deploy
        run: |
          echo "Validating JSON files..."
          find data -name "*.json" -type f | while read file; do
            if ! python3 -m json.tool "$file" > /dev/null 2>&1; then
              echo "ERROR: Invalid JSON in $file"
              exit 1
            fi
          done
          echo "All JSON files are valid!"

      - name: Run API Endpoint Tests
        run: node test/worker.test.js

      - name: Check Cloudflare Credentials
        id: check-creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning ::CLOUDFLARE_API_TOKEN secret is not configured in repository settings. Deployment step will be skipped."
            echo "has_token=false" >> $GITHUB_OUTPUT
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Cloudflare Workers with Assets
        if: steps.check-creds.outputs.has_token == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy
